name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the stable job on master pushes the badge to the badges branch
    strategy:
      matrix:
        version: [v0.10.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}
      - run: nvim --clean --headless -l tests/run.lua | tee test.log
        shell: bash # with pipefail, so a failing run still fails the job
      # The README badge is a shields.io endpoint reading tests.json on the badges branch.
      - if: ${{ !cancelled() && github.event_name == 'push' && matrix.version == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          message=$(sed -n 's|^\([0-9]*/[0-9]*\) passed$|\1|p' test.log)
          if [ -z "$message" ]; then message=error color=red
          elif [ "${message%/*}" = "${message#*/}" ]; then color=brightgreen
          else color=red; fi
          mkdir badges
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"%s"}\n' "$message" "$color" > badges/tests.json
          cd badges
          git init -q -b badges
          git add tests.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "tests: $message"
          git push -qf "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" badges
